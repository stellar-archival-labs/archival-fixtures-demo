# demo-restore.yml — manually-triggered restore of the demo contract on TESTNET.
#
# This is the remediation half of the demo: run it (via the "Run workflow"
# button) once the scheduled demo-scan.yml has gone red — i.e. the entry is
# Critical or Archived. It:
#
#   1. Detects the entry's state off-chain via scripts/read-entry-ttl.py
#      (RPC `getLedgerEntries`; TTL 0 means archived — contracts cannot read
#      their own TTL, and the RPC rejects direct TTL-key queries).
#   2. If archived, submits RestoreFootprintOps bringing back EVERY entry the
#      demo archived together: the contract instance, its code (wasm), and the
#      persistent VALUE entry. They all decay on the same clock, so all three
#      archive together — and an archived instance cannot be loaded for
#      invocation, so restoring only the VALUE entry is not enough.
#   3. Raises the TTL to `extend_to` ledgers through the contract's `extend`
#      (a no-op floor while the TTL is already higher).
#   4. Re-reads the TTL off-chain and fails the run if it did not take.
#
# ⚠️  TESTNET ONLY. This workflow only ever signs with a TESTNET-ONLY throwaway
# key: either the optional TESTNET_THROWAWAY_SECRET_KEY secret, or a fresh key
# generated and friendbot-funded at runtime. Both hold only testnet lumens and
# can be discarded anytime. Never put a mainnet key in these secrets and never
# point SOROBAN_RPC_URL at mainnet.
#
# Why no secret is required: RestoreFootprintOp is permissionless (CAP-0046-12)
# and the demo contract's `extend` is not owner-gated
# (contracts/rapid-expiry-demo/src/lib.rs), so ANY funded testnet account can
# perform the restore. If the secret is unset the workflow generates and funds a
# throwaway key on the fly.
#
# Setup (same as demo-scan.yml):
#   1. Deploy once locally:  ./scripts/deploy-and-shrink-ttl.sh
#   2. Actions -> Variables -> New repository variable:
#        Name: CONTRACT_ID,  Value: <the contract id printed by step 1>
#   3. (Optional) Actions -> Secrets -> New repository secret:
#        Name: TESTNET_THROWAWAY_SECRET_KEY,
#        Value: <the S... key in .deploy/testnet-throwaway.secret>
#      Without it, a fresh throwaway key is generated per run.
#   4. Run via the "Run workflow" button.

name: demo-restore

on:
  workflow_dispatch:
    inputs:
      contract_id:
        description: "Contract id to restore (defaults to the CONTRACT_ID repository variable)"
        required: false
        type: string
      entry_key:
        description: "Storage key symbol to restore (the demo's persistent entry)"
        required: false
        type: string
        default: VALUE
      extend_to:
        description: "TTL in ledgers to raise the entry to after restore (default: testnet minPersistentTTL, 120960 ≈ 7 days)"
        required: false
        type: string
        default: "120960"

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stellar-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore and extend the demo entry
        id: restore
        env:
          CONTRACT_ID: ${{ inputs.contract_id || vars.CONTRACT_ID }}
          THROWAWAY_KEY: ${{ secrets.TESTNET_THROWAWAY_SECRET_KEY }}
          ENTRY_KEY: ${{ inputs.entry_key || 'VALUE' }}
          EXTEND_TO: ${{ inputs.extend_to || '120960' }}
        run: |
          set -euo pipefail
          RPC="https://soroban-testnet.stellar.org"
          PASSPHRASE="Test SDF Network ; September 2015"
          THROWAWAY_ALIAS="testnet-demo-throwaway"

          [[ -n "${CONTRACT_ID:-}" ]] || { echo "::error::CONTRACT_ID is not set — pass it as a workflow input or set the CONTRACT_ID repository variable (see workflow header)"; exit 1; }

          # --- Signing key. -------------------------------------------------
          # Prefer the optional TESTNET_THROWAWAY_SECRET_KEY secret. If it is
          # not set, generate a fresh TESTNET-ONLY throwaway key and fund it
          # from the testnet friendbot — the restore path is permissionless, so
          # no secret has to be stored for this demo to work.
          if [[ -z "${THROWAWAY_KEY:-}" ]]; then
            echo "TESTNET_THROWAWAY_SECRET_KEY not set — generating a fresh TESTNET-ONLY throwaway key and funding it with testnet lumens..."
            stellar keys generate "$THROWAWAY_ALIAS" \
              --as-secret --fund \
              --rpc-url "$RPC" --network-passphrase "$PASSPHRASE"
            # `keys generate --as-secret` stores the secret under the alias
            # instead of printing it; read it back the same way
            # scripts/deploy-and-shrink-ttl.sh does.
            THROWAWAY_KEY="$(stellar keys show "$THROWAWAY_ALIAS" | grep -oE 'S[A-Z2-7]{55}' | head -n1 || true)"
            [[ -n "$THROWAWAY_KEY" ]] || { echo "::error::could not read the generated throwaway secret via 'stellar keys show $THROWAWAY_ALIAS'"; exit 1; }
            echo "generated and funded a throwaway testnet key (disposable)"
          fi
          [[ "$THROWAWAY_KEY" == S* ]] || { echo "::error::the signing key does not look like a testnet secret key — this repo is TESTNET-ONLY"; exit 1; }

          echo "contract=$CONTRACT_ID entry=$ENTRY_KEY rpc=$RPC (TESTNET ONLY)"

          read_ttl() { python3 scripts/read-entry-ttl.py --contract-id "$CONTRACT_ID" --entry-key "$ENTRY_KEY" --rpc-url "$RPC"; }

          # Restore one entry, tolerating the no-op case (the entry is already
          # live). A real failure still surfaces: nothing is live afterwards, so
          # the invoke/final check below fails the run.
          restore_entry() {
            local what="$1"; shift
            echo "-> restoring ${what}..."
            if "$@"; then
              echo "   ${what}: restore submitted"
            else
              echo "::warning::${what}: 'stellar contract restore' returned non-zero (already live, or restore failed — the extend step will confirm)"
            fi
          }

          # --- 1. Detect the entry's state off-chain. ---
          TTL="$(read_ttl)"
          echo "pre-restore ttl=$TTL ledgers"

          if (( TTL <= 0 )); then
            echo "entry is ARCHIVED — restoring with RestoreFootprintOp..."

            # The demo's short TTL archives the instance, the code, and the
            # VALUE data entry together. Bring them all back: the instance is
            # restored first because its live entry carries the wasm hash we
            # need before the code entry can be restored.
            restore_entry "contract instance" \
              stellar contract restore \
                --id "$CONTRACT_ID" --source "$THROWAWAY_KEY" \
                --durability persistent \
                --rpc-url "$RPC" --network-passphrase "$PASSPHRASE"

            # Read the wasm hash from the (now live) instance. Falls back to the
            # code key recorded in the deployment transcript so the code can
            # still be restored if the instance read is unavailable.
            WASM_HASH="$(stellar contract info hash --id "$CONTRACT_ID" \
              --rpc-url "$RPC" --network-passphrase "$PASSPHRASE" 2>/dev/null || true)"
            if [[ -z "$WASM_HASH" && -f .transcripts/02-scan-healthy.json ]]; then
              WASM_HASH="$(python3 - <<'PY'
          import base64, json
          with open(".transcripts/02-scan-healthy.json") as fh:
              entries = json.load(fh)["entries"]
          code = next(e for e in entries if e.get("kind") == "contract_code")
          # LedgerKey::ContractCode XDR = 4-byte type tag + 32-byte wasm hash.
          print(base64.b64decode(code["key_xdr"])[4:].hex())
          PY
              )"
              echo "wasm hash recovered from .transcripts/02-scan-healthy.json"
            fi

            if [[ -n "$WASM_HASH" ]]; then
              restore_entry "contract code (wasm ${WASM_HASH:0:12}...)" \
                stellar contract restore \
                  --wasm-hash "$WASM_HASH" --source "$THROWAWAY_KEY" \
                  --rpc-url "$RPC" --network-passphrase "$PASSPHRASE"
            else
              echo "::warning::could not determine the wasm hash — skipping the code restore"
            fi

            restore_entry "data entry '$ENTRY_KEY'" \
              stellar contract restore \
                --id "$CONTRACT_ID" --key "$ENTRY_KEY" \
                --source "$THROWAWAY_KEY" --durability persistent \
                --rpc-url "$RPC" --network-passphrase "$PASSPHRASE"

            echo "restores submitted — entries are live again at the network-minimum TTL"
          else
            echo "entry is LIVE — nothing to restore; extending as a floor"
          fi

          # --- 2. Raise the TTL (no-op while it is already at/above the target). ---
          echo "extending entry to at least ${EXTEND_TO} ledgers..."
          stellar contract invoke \
              --id "$CONTRACT_ID" --source "$THROWAWAY_KEY" \
              --rpc-url "$RPC" --network-passphrase "$PASSPHRASE" \
              -- extend --ledgers "$EXTEND_TO" >/dev/null

          # --- 3. Verify off-chain. ---
          FINAL_TTL="$(read_ttl)"
          echo "post-restore ttl=$FINAL_TTL ledgers (~$(( FINAL_TTL * 5 / 3600 ))h)"
          echo "ttl=$FINAL_TTL" >> "$GITHUB_OUTPUT"

          [[ "$FINAL_TTL" -gt 0 ]] || { echo "::error::entry is still archived after restore"; exit 1; }

      - name: Summarize
        run: |
          echo "Demo entry restored. TTL now ${{ steps.restore.outputs.ttl }} ledgers. The scheduled demo-scan.yml should go green on its next run."
